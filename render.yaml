# Render Blueprint for the API. Import this repo at
# https://dashboard.render.com/blueprints and Render creates the service
# below with these settings pre-filled — only the `sync: false` values need
# to be typed in by hand, in the Render dashboard, since they're secrets that
# have no business living in a file committed to git.
#
# `shared` must be built before the server, which is why the build command is
# `build:server` (defined in the root package.json) rather than a workspace
# script — see the README's "Deploying" section for the full walkthrough.
services:
  - type: web
    name: shoe-shop-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:server
    startCommand: npm start -w @shoe-shop/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: MAIL_FROM
        sync: false
